<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="robots" content="noindex">
  <title>شارك معنا | مبادرة نبّه</title>
  <meta name="description" content="مبادرة نبّه — نادي الذكاء الاصطناعي">
  <meta property="og:title" content="شارك معنا في مبادرة نبّه">
  <meta property="og:description" content="مشاركة بسيطة — نادي الذكاء الاصطناعي">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preload" href="assets/fonts/saudi-bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body class="phase-intro">
  <main id="stage" aria-live="polite">

    <!-- 0–1s : innocent landing page -->
    <section id="intro" class="scene">
      <div class="intro-card">
        <div class="intro-badge" data-cfg="clubName">نادي الذكاء الاصطناعي</div>
        <h1 class="intro-title" data-cfg="introTitle">شارك معنا في مبادرة نبّه</h1>
        <p class="intro-sub" data-cfg="introSubtitle">لحظات وتبدأ المشاركة…</p>
        <div class="intro-loader"><span></span></div>
      </div>

      <!-- 2.0–4.25s : Browser Takeover Simulation (pure in-page layers) -->
      <div id="wins" aria-hidden="true"></div>
      <div class="blog" id="blog" aria-hidden="true"></div>
    </section>

    <!-- final screen: stays until the visitor leaves or replays -->
    <section id="safe" class="scene">
      <div class="shield">
        <svg viewBox="0 0 120 140" aria-hidden="true">
          <path class="sh" d="M60 6 110 24v40c0 34-21 58-50 70C31 122 10 98 10 64V24Z"/>
          <path class="ck" d="M38 70l15 15 30-32"/>
        </svg>
      </div>
      <h2 class="safe-1 reveal" data-cfg="safeLine1">لا تخاف، جهازك آمن.</h2>
      <p class="safe-2 reveal" data-cfg="safeLine2">هذه مجرد محاكاة توعوية</p>
      <div class="safe-club reveal" data-cfg="clubName">نادي الذكاء الاصطناعي</div>
      <button id="replay" class="replay" type="button" hidden>↻ إعادة التجربة</button>
    </section>

  </main>

  <div id="tear" aria-hidden="true"></div>
  <div id="bf" aria-hidden="true"></div>
  <button id="skip" class="skip" type="button" hidden>تخطي المشهد ‹</button>
  <noscript><div class="nojs">لا تخاف، جهازك آمن — هذه مجرد محاكاة توعوية.</div></noscript>

  <script src="app.js?v=7" defer></script>
</body>
</html>

name: Publish & verify

# main is the source of truth. This copies the site to the gh-pages branch
# (which GitHub Pages serves), then checks the PUBLIC URL from outside.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync site to gh-pages
        run: |
          mkdir /tmp/site
          cp -r index.html style.css app.js config.json manifest.webmanifest assets qr .nojekyll /tmp/site/
          echo "$GITHUB_SHA" > /tmp/site/build.txt
          git fetch origin gh-pages --depth 1
          git checkout -B gh-pages origin/gh-pages
          git rm -rq . && git clean -fdq
          cp -r /tmp/site/. .
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish $GITHUB_SHA" || echo "nothing to change"
          git push origin gh-pages

  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the public URL serves this commit
        run: |
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            live=$(curl -s "${BASE}build.txt?nc=$RANDOM" || true)
            [ "$live" = "$GITHUB_SHA" ] && echo "live build matches $GITHUB_SHA" && break
            echo "attempt $i: live='$live'"; sleep 15
          done
          [ "$(curl -s "${BASE}build.txt?nc=$RANDOM")" = "$GITHUB_SHA" ]
      - name: Check every file over HTTPS (anonymous, no cookies)
        run: |
          curl -sSI "$BASE" | head -5
          for f in "" style.css app.js config.json manifest.webmanifest assets/icon-180.png assets/icon-192.png assets/icon-512.png assets/fonts/saudi-bold.woff2 assets/fonts/saudi-regular.woff2 assets/favicon.svg qr/nabbih-qr.png qr/nabbih-qr.svg; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B' "$BASE$f")
            echo "/$f -> $r"; case "$r" in 200*) ;; *) exit 1;; esac
          done
          curl -s "$BASE" | grep -q 'مبادرة نبّه'
      - name: Open the live page on iPhone and Android profiles
        run: |
          mkdir t && cd t && npm init -y >/dev/null && npm i -s playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > check.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            let ok = true;
            for (const d of ['iPhone 13', 'iPhone SE', 'Pixel 7', 'Galaxy S9+']) {
              const ctx = await b.newContext({ ...devices[d] });
              // record every change of <body class> with a timestamp
              await ctx.addInitScript(() => {
                window.__log = [];
                document.addEventListener('DOMContentLoaded', () => {
                  const t0 = performance.now();
                  const rec = () => window.__log.push([Math.round(performance.now() - t0), document.body.className]);
                  rec(); new MutationObserver(rec).observe(document.body, { attributes: true, attributeFilter: ['class'] });
                });
              });
              const p = await ctx.newPage(); const errs = []; let maxWins = 0;
              p.on('pageerror', e => errs.push(e.message));
              await p.goto(process.env.BASE);
              const buttonsAtStart = await p.locator('button:visible').count();
              for (let i = 0; i < 40; i++) { maxWins += await p.locator('#stage .ios:not(.back)').count(); await p.waitForTimeout(100); }
              await p.waitForTimeout(16000);
              const log = await p.evaluate(() => window.__log);
              const first = re => { const e = log.find(([, c]) => re.test(c)); return e ? e[0] : -1; };
              const r0 = first(/\brun\b/);
              const at = re => { const v = first(re); return v < 0 ? -1 : v - r0; };
              const t = { attack: at(/stall/), log: at(/blogging/), freeze: at(/\bhang\b/), black: at(/phase-void/), safe: at(/phase-safe/) };
              const endsOnSafe = /phase-safe/.test(log[log.length - 1][1]) && first(/phase-final/) === -1;
              const noFinal = (await p.locator('#final').count()) === 0;
              const reassure = (await p.locator('.safe-2').isVisible()) && (await p.locator('.safe-club').isVisible());
              const fill = await p.evaluate(() => { const r = document.getElementById('stage').getBoundingClientRect(); return r.top <= 0 && r.left <= 0 && r.width >= innerWidth && r.height >= innerHeight; });
                            const fits = await p.evaluate(() => document.documentElement.scrollWidth <= innerWidth);
              const near = (v, want, tol) => Math.abs(v - want) <= tol;
              const order = r0 >= 0 && near(t.attack, 2000, 250) && near(t.log, 4000, 250) && near(t.freeze - t.log, 700, 150) && near(t.black - t.freeze, 500, 150) && near(t.safe - t.black, 2000, 250);
              const pass = buttonsAtStart === 0 && maxWins >= 5 && order && endsOnSafe && noFinal && reassure && fill && fits && errs.length === 0;
              console.log(`${pass ? 'PASS' : 'FAIL'} ${d}: buttonsAtStart=${buttonsAtStart} msFromStart=${JSON.stringify(t)} alertSamplesSeen=${maxWins} stillOnSafeAt20s=${endsOnSafe} finalScreenRemoved=${noFinal} reassuranceVisible=${reassure} fillsViewport=${fill} noHScroll=${fits} errors=${JSON.stringify(errs)}`);
              ok = ok && pass; await ctx.close();
            }
            await b.close(); process.exit(ok ? 0 : 1);
          })();
          JS
          node check.js
